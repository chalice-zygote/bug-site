<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.U.G. FLAGS — BEAUTIFUL UNITY GYMNASIUM</title>
<link rel="icon" href="assets/off-fav.svg" type="image/svg+xml">
<link rel="stylesheet" href="bug.css">

<style>
/* ── FLAGS ────────────────────────────────────────────────
   BUG.OBJT.003. The set, three across.
   ─────────────────────────────────────────────────────────── */
#noise { position: fixed; inset: 0; z-index: 0; pointer-events: none;
         opacity: 0.055; mix-blend-mode: multiply; }
#page { position: relative; z-index: 1; }

main {
  max-width: 1020px;
  margin: 0 auto;
  padding: 24px 46px 160px;
  font-family: var(--type-cn);
  color: var(--blue);
  --lh: 1.06;
}

.head { border-bottom: 3px solid var(--blue); padding-bottom: 9px; margin-bottom: 30px; }
.head h1 { text-transform: uppercase; font-weight: 700; font-size: 46px; line-height: var(--lh); letter-spacing: -0.06em; }
.head .sub { font-weight: 400; font-size: 19px; line-height: 1.0; letter-spacing: -0.04em; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 22px; }

/* No forced aspect-ratio. The vectors are not all 1080x1920, so
   fixing one ratio and using object-fit:contain padded every row
   with empty space that no gap value could remove — the space was
   inside the box, not between boxes. Let the art set its own height. */
.grid img {
  width: 100%;
  height: auto;
  display: block;
  cursor: zoom-in;
}

/* ── SIMS ─────────────────────────────────────────────────
   The cloth renders are portrait; here they run horizontal.
   Rotating an element does not change the space it reserves,
   so the cell sets the landscape box and the video is sized to
   the box's OPPOSITE axis before being turned into it.
   No background — the alpha is the point.
   ─────────────────────────────────────────────────────────── */
.sim {
  position: relative;
  width: 100%;
  aspect-ratio: 1920 / 1080;
  overflow: visible;
  cursor: zoom-in;
}
.sim video {
  position: absolute;
  top: 50%; left: 50%;
  /* Pre-rotation width must equal the container's HEIGHT, which for a
     16:9 box is 56.25% of its width. The earlier 177.78% was the
     reciprocal — it oversized the video by 3x and cropped it. */
  width: 82%;                        /* 56.25% is an exact fit; this
                                        oversizes it on purpose, so the
                                        cloth breaks its cell */
  height: auto;
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center center;
  display: block;
}

/* this one's sim reads upside down against the rest */
.sim.flip video { transform: translate(-50%, -50%) rotate(270deg); }

/* full-width spacer so the drawings and the cloth read as two runs */
.break { grid-column: 1 / -1; height: 46px; }

/* ── lightbox ─────────────────────────────────────────────── */
#lightbox {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(255,255,255,0.94);
  display: none; align-items: center; justify-content: center;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img,
#lightbox video { max-width: 94vw; max-height: 88vh; display: block;
                  object-fit: contain; cursor: zoom-out; }
#lightbox video { display: none; }
#lightbox.vid video { display: block; }
#lightbox.vid img   { display: none; }
#lb-meta {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 18px;
  font-weight: 400; font-size: 18px; letter-spacing: -0.04em;
  color: var(--blue); text-align: right; pointer-events: none;
}
.lb-btn {
  position: absolute; background: none; border: 0; padding: 0; cursor: pointer;
  font-family: var(--type-cn); font-weight: 700; font-size: 40px; line-height: 1;
  color: var(--blue);
  transition: color 0.14s ease, transform 0.2s cubic-bezier(0.3,1.5,0.5,1);
}
.lb-btn:hover { color: var(--orange); }
#lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
#lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
#lb-prev:hover { transform: translateY(-50%) scale(1.12); }
#lb-next:hover { transform: translateY(-50%) scale(1.12); }
#lb-close { right: 18px; top: 12px; font-size: 30px; }
body.lb-open { overflow: hidden; }

@media (max-width: 900px) {
  main { padding: 14px 16px 110px; }
  .head h1 { font-size: 30px; }
  .head .sub { font-size: 16px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
  .lb-btn { font-size: 30px; }
  #lb-meta { font-size: 14px; }
}
</style>
</head>

<body data-page="media">

<svg id="noise" xmlns="http://www.w3.org/2000/svg">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>

<div id="page">
  <div id="chrome-mount"></div>
  <main>
    <div class="head">
      <h1>B.U.G. FLAGS</h1>
      <div class="sub">Open edition</div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Full size">
  <img id="lb-img" src="" alt="">
  <video id="lb-vid" autoplay loop muted playsinline></video>
  <div id="lb-meta"><span id="lb-n"></span></div>
  <button class="lb-btn" id="lb-prev" aria-label="Previous">&larr;</button>
  <button class="lb-btn" id="lb-next" aria-label="Next">&rarr;</button>
  <button class="lb-btn" id="lb-close" aria-label="Close">&times;</button>
</div>

<audio id="stream" preload="none"></audio>

<script src="bug-chrome.js"></script>
<script>
(() => {
  'use strict';

  const V = 'assets/objects/bug-flag-vectors/';
  const T = 'assets/objects/bug-flags-textured/';

  /* Ten vectors plus the textured disclaimer, which has no vector —
     the set is the point, so it goes in rather than being left out
     for the sake of a consistent source format. */
  const IS_WEBKIT = navigator.vendor === 'Apple Computer, Inc.';
  const VEXT = IS_WEBKIT ? '.mp4' : '.webm';

  /* the eleven cloth sims, same grid as the vectors above them */
  const SIM = [
    'circle-pendant', 'benzy-red', 'chip', 'chromedome', 'disclaimer',
    'finder', 'racer', 'sam-blue', 'unity', 'viber', 'x'
  ];

  const SET = [
    V + 'benzy-red-2.svg',
    V + 'chip-2.svg',
    V + 'circle-pendant-resize.svg',
    T + 'disclaimer-textured.jpg',
    V + 'finder-2.svg',
    V + 'pink-dome.svg',
    V + 'racer-2.svg',
    V + 'sam-blue2.svg',
    V + 'unity-2.svg',
    V + 'vibe-2.svg',
    V + 'x-2.svg'
  ];

  document.getElementById('grid').innerHTML =
    SET.map(src => `<img src="${src}" alt="" loading="lazy"
          onerror="this.src=this.src.replace('.jpg','.png')">`).join('') +
    '<div class="break"></div>' +
    SIM.map(f => `<div class="sim${f === 'unity' ? ' flip' : ''}">
          <video src="assets/flags/${f}${VEXT}"
          autoplay muted loop playsinline preload="auto"></video></div>`).join('');

  /* stills and sims in one list, in the order they appear */
  const pics = [...document.querySelectorAll('.grid img, .sim')].map(el =>
    el.classList.contains('sim')
      ? { video: el.querySelector('video').src, flip: el.classList.contains('flip') }
      : { src: el.src });

  /* eleven 1080x1920 alpha decodes at once will stall a phone —
     each plays only while it is on screen */
  const vids = [...document.querySelectorAll('.grid .sim video')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) v.play().catch(() => {});
      else v.pause();
    }), { rootMargin: '250px 0px', threshold: 0.15 });
    vids.forEach(v => io.observe(v));
  } else {
    vids.forEach(v => v.play().catch(() => {}));
  }
  const lb   = document.getElementById('lightbox');
  const img  = document.getElementById('lb-img');
  let at = -1;

  const vid = document.getElementById('lb-vid');

  const show = i => {
    if (i < 0 || i >= pics.length) return;
    at = i;
    const p = pics[i];
    if (p.video) {
      lb.classList.add('vid');
      if (vid.src !== p.video) vid.src = p.video;
      /* the cloth is shot portrait — turn it as the grid does */
      vid.style.transform = 'rotate(' + (p.flip ? 270 : 90) + 'deg)';
      vid.style.maxWidth = '88vh';
      vid.style.maxHeight = '94vw';
      vid.play().catch(() => {});
    } else {
      lb.classList.remove('vid');
      vid.pause();
      img.src = p.src;
    }
    document.getElementById('lb-n').textContent = (i + 1) + ' / ' + pics.length;
    lb.classList.add('open');
    document.body.classList.add('lb-open');
    [i - 1, i + 1].forEach(j => {
      if (pics[j] && pics[j].src) { const w = new Image(); w.src = pics[j].src; }
    });
  };
  const close = () => {
    lb.classList.remove('open', 'vid');
    document.body.classList.remove('lb-open');
    vid.pause();
    img.src = '';
  };

  [...document.querySelectorAll('.grid img, .sim')]
    .forEach((el, i) => el.addEventListener('click', () => show(i)));
  lb.addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', e => {
    e.stopPropagation(); show((at - 1 + pics.length) % pics.length); });
  document.getElementById('lb-next').addEventListener('click', e => {
    e.stopPropagation(); show((at + 1) % pics.length); });
  document.getElementById('lb-close').addEventListener('click', e => {
    e.stopPropagation(); close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')     close();
    if (e.key === 'ArrowLeft')  show((at - 1 + pics.length) % pics.length);
    if (e.key === 'ArrowRight') show((at + 1) % pics.length);
  });
})();
</script>

</body>
</html>
