<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URIEL &mdash; MIASMA &mdash; BEAUTIFUL UNITY GYMNASIUM</title>
<link rel="icon" href="assets/off-fav.svg" type="image/svg+xml">
<link rel="stylesheet" href="bug.css">
<link rel="stylesheet" href="release.css">
</head>

<body data-page="catalog" data-release="miasma">

<div id="page">
  <div id="chrome-mount"></div>

  <div class="twin">
    <div class="col-plates" id="plates"></div>
    <div class="spine" id="spine"></div>
    <div class="col-record">
      <div class="ground-wrap">
        <div class="ground"   id="ground"></div>
        <div class="ground-b" id="ground-b"></div>
        <svg class="ground-grain" xmlns="http://www.w3.org/2000/svg">
          <filter id="gr">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
          </filter>
          <rect width="100%" height="100%" filter="url(#gr)"/>
        </svg>
      </div>
      <div class="record-scroll">
        <div class="record" id="record"></div>
      </div>
    </div>
  </div>
</div>

<audio id="stream" preload="none"></audio>

<script src="releases.js"></script>
<script src="bug-chrome.js"></script>
<script src="release-view.js"></script>

</body>
</html>
