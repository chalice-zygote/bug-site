<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGISTER — BEAUTIFUL UNITY GYMNASIUM</title>
<link rel="icon" href="assets/OFF-fav.svg" type="image/svg+xml">
<link rel="stylesheet" href="bug.css">

<style>
/* ── REGISTER ─────────────────────────────────────────────
   The whole catalogue in one list. Deliberately plain — this
   is the index, not a display page.
   ─────────────────────────────────────────────────────────── */
#noise { position: fixed; inset: 0; z-index: 0; pointer-events: none;
         opacity: 0.055; mix-blend-mode: multiply; }
#page { position: relative; z-index: 1; }

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 24px 46px 160px;
  font-family: var(--type-cn);
  color: var(--blue);
  --lh: 1.06;
}

.head { border-bottom: 3px solid var(--blue); padding-bottom: 9px; margin-bottom: 8px; }
.head h1 { font-weight: 700; font-size: 46px; line-height: var(--lh); letter-spacing: -0.06em; }
.head .sub { font-weight: 400; font-size: 19px; line-height: var(--lh); letter-spacing: -0.04em; }

.div-head {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin: 54px 0 4px; padding-bottom: 7px;
  border-bottom: 1px solid rgba(4,0,255,0.34);
}
.div-head h2 { font-weight: 700; font-size: 30px; line-height: var(--lh); letter-spacing: -0.05em; }
.div-head .dom { font-weight: 400; font-size: 18px; line-height: var(--lh);
                 letter-spacing: -0.04em; opacity: 0.7; }

.sub-head {
  margin: 20px 0 4px;
  font-weight: 400; font-size: 17px; line-height: var(--lh);
  letter-spacing: -0.04em; opacity: 0.6;
}

/* NOT .row — bug.css uses that for the subscribe/search stack in the
   header, and a generic name here overrode it site-wide. */
.reg-row {
  display: grid;
  grid-template-columns: 190px 1fr 120px 120px;
  gap: 14px;
  padding: 5px 0;
  font-weight: 400; font-size: 19px; line-height: var(--lh);
  letter-spacing: -0.04em;
  border-bottom: 1px solid rgba(4,0,255,0.1);
}
.reg-row .no { font-weight: 700; white-space: nowrap; }
.reg-row .meta, .reg-row .date { opacity: 0.7; white-space: nowrap; }
.reg-row.none { grid-template-columns: 1fr; opacity: 0.55; }
.reg-row a { color: inherit; text-decoration: none; }
.reg-row a:hover { color: var(--orange); }

.note { margin-top: 14px; font-weight: 400; font-size: 17px;
        line-height: 1.3; letter-spacing: -0.04em; opacity: 0.66; max-width: 62ch; }

@media (max-width: 900px) {
  main { padding: 14px 16px 110px; }
  .head h1 { font-size: 30px; }
  .div-head h2 { font-size: 22px; }
  .reg-row { grid-template-columns: 1fr; gap: 1px; padding: 9px 0; font-size: 16px; }
  .reg-row .meta, .reg-row .date { white-space: normal; }
}
</style>
</head>

<body data-page="register">

<svg id="noise" xmlns="http://www.w3.org/2000/svg">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>

<div id="page">
  <div id="chrome-mount"></div>
  <main>
    <div class="head">
      <h1>B.U.G. CATALOG REGISTER</h1>
      <div class="sub">CREATIVE EXERCISE &amp; DEVELOPMENT &middot; 02.21.07 &middot; LAST REVISED 08.10.2026</div>
    </div>
    <div id="reg"></div>
  </main>
</div>

<audio id="stream" preload="none"></audio>

<script src="channels.js"></script>
<script src="bug-chrome.js"></script>
<script>
(() => {
  'use strict';

  const MW = '<span class="mw"><i>midi</i>WORLD<i>live</i></span>';

  /* Transcribed from bug-register.md, rev. 08.10.2026.
     WRKS lists completed recordings only — nothing provisional or
     forthcoming, and no unnumbered items.

     PRGM is the exception: an upcoming event is the one thing a
     register has to carry BEFORE it exists, and it always links
     to its ticketing. A work is documented after; an event has to
     be findable before. */
  const REG = [
    { code: 'WRKS', dom: 'recordings', rows: [
      ['BUG.WRKS.001', 'Unity Garnish — F***ing Angels', 'single', '07.09.2025', 'angels.html'],
      ['BUG.WRKS.002', 'Uriel — Miasma',                 'album',  '04.28.2026', 'miasma.html'],
      ['BUG.WRKS.003', 'Teton Eternal — Miracle!',       'album',  '08.16.2026', 'miracle.html']
    ]},

    { code: 'PRGM', dom: 'events', rows: [
      ['BUG.PRGM.001', 'Saint David of Wales',         'Portland OR', '04.29.2025', 'gallery.html#saint-david'],
      ['BUG.PRGM.002', MW + ' — North America tour',   '6 legs',      '09.04–09.28.2025', 'gallery.html#midiworldlive'],
      ['BUG.PRGM.003', 'Angel Dust (1994) — rescore',  'Clinton St.', '12.14.2025', 'gallery.html#angel-dust'],
      ['BUG.PRGM.004', 'Wyrd Hut takeover',            'Portland OR', '06.21.2026', 'gallery.html#wyrd-hut'],
      ['BUG.PRGM.005', 'B.U.G. × Virtua — Holocene',   'Portland OR', '06.24.2026', 'gallery.html#holocene'],
      ['BUG.PRGM.005w','4ct1v4t0rs.com',               'carrier — web', '06.24.2026',
       'https://4ct1v4t0rs.com'],
      ['BUG.PRGM.006', '1412 Gallery',                 'Seattle WA',  '06.26.2026', 'gallery.html#1412-gallery'],
      ['BUG.PRGM.007', 'Cold New Age [CENO-BITE OST]', 'Drift II — tickets', '09.05.2026',
       'https://sickening.events/e/drift-ii']
    ]},

    { code: 'CHNL', dom: 'video', rows: (window.CHANNELS || []).map(c => [
      c.cat,
      c.artist + ' — ' + c.title.replace(/&rsquo;/g, '\u2019'),
      c.dur,
      c.date,
      'https://www.youtube.com/watch?v=' + c.yt
    ])},

    { code: 'OBJT', dom: 'art objects', rows: [
      ['BUG.OBJT.001', 'B.U.G. × UG Cursor Cross Shirt', 'purchase', '—', 'shirts.html'],
      ['BUG.OBJT.002', MW + ' Hat',                      'sold out',     '—', 'hats.html'],
      ['BUG.OBJT.003', 'B.U.G. Flags',                   'open edition', '—', 'flags.html']
    ]},

    { code: 'COMM', dom: 'communications', rows: [] },
    { code: 'FILE', dom: 'documents',           rows: [] },
    { code: 'ARCV', dom: 'afterimage',                 rows: [] },
    { code: 'ERRR', dom: 'deletions',                rows: [] }
  ];

  const row = r => {
    const ext = r[4] && r[4].startsWith('http');
    const title = r[4]
      ? `<a href="${r[4]}"${ext ? ' target="_blank" rel="noopener"' : ''}>${r[1]}</a>`
      : r[1];
    return `<div class="reg-row"><span class="no">${r[0]}</span><span class="ttl">${title}</span>` +
           `<span class="meta">${r[2]}</span><span class="date">${r[3]}</span></div>`;
  };

  document.getElementById('reg').innerHTML = REG.filter(d => d.rows.length).map(d => `
    <div class="div-head"><h2>BUG.${d.code}</h2><span class="dom">${d.dom}</span></div>
    ${d.rows.map(row).join('')}
  `).join('') + `
    <div class="note">All per-division sequence. Numberwangs are non-recyclonable.
    Multi-part works produce decimals. A recording and its video are simultaneous
    objects. Deletion is a transfer, creates a residue.</div>`;
})();
</script>

</body>
</html>
